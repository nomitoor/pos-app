name: pos_app
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # Barcode scanning
  mobile_scanner: ^7.2.0

  # Local database
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  sqflite_common_ffi_web: ^1.2.0
  path: ^1.9.0

  # PDF generation & printing
  pdf: ^3.11.1
  printing: ^5.13.1

  # State management
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1

  # UI helpers
  intl: ^0.19.0
  uuid: ^4.4.0
  file_picker: ^13.1.0

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3
  image_picker: ^1.2.4

  cupertino_ui: any
  material_ui: any
  print_bluetooth_thermal: ^1.2.5
  esc_pos_utils_plus: ^2.0.4
  flutter_local_notifications: ^23.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true

  assets:
    - assets/branding/

  # Archivo, bundled so the app looks the same offline.
  # Two widths of one family: normal for reading, expanded for
  # headings and money (echoes the wide "THREAD" in the logo).
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Archivo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Archivo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Archivo-Bold.ttf
          weight: 700
    - family: ArchivoExpanded
      fonts:
        - asset: assets/fonts/ArchivoExpanded-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ArchivoExpanded-ExtraBold.ttf
          weight: 800
